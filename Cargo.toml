[package]
name = "planet_generator"
version = "0.1.0"
edition = "2021"
default-run = "planet_generator"

[lib]
name = "planet_generator"
path = "src/lib.rs"

[[bin]]
name = "planet_generator"
path = "src/main.rs"

[dependencies]
image = "0.25"
gif = "0.14"
png = "0.18"
fontdue = "0.9"
clap = { version = "4.5", features = ["derive"] }
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
wgpu = { version = "23", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.29", optional = true }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
base64 = "0.22"
exr = "1.7"
smallvec = "1.11"
minifb = "0.28"
font8x8 = "0.3"

[features]
default = []
# The frozen terminal explorer, menu and legends views (--legacy-explorer).
legacy = ["dep:crossterm", "dep:ratatui"]
# The bard and the director: an HTTP client for a local model (Ollama).
llm = ["dep:reqwest", "dep:tokio"]
# GPU paths of the legacy erosion pass and of the cartography export (both have CPU fallbacks).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
tempfile = "3.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
